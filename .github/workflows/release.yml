name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 0.2.0"
        required: true
        default: "dev"
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v = "${{ inputs.version }}" } else { $v = "${{ github.ref_name }}" -replace '^v','' }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build desktop
        run: cargo build --release -p fluxdown_ui_app --bin fluxdown-desktop
      - name: Build agent
        run: cargo build --release -p fluxdown_agent --bin fluxdown-agent
      - name: Build daemon
        run: cargo build --release -p fluxdown_daemon --bin fluxdownd
      - name: Build native host
        run: cargo build --release -p fluxdown_nmh --bin fluxdown_nmh
      - name: Create portable package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $dir = "build\release\FluxDown-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\fluxdown-desktop.exe $dir
          Copy-Item target\release\fluxdown-agent.exe $dir
          Copy-Item target\release\fluxdownd.exe $dir
          Copy-Item target\release\fluxdown_nmh.exe $dir
          Copy-Item LICENSE $dir
          New-Item -ItemType File -Force -Path "$dir\portable" | Out-Null
          Compress-Archive -Path "$dir\*" -DestinationPath "build\release\FluxDown-$version-windows-x64-portable.zip"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\windows\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/release/*.zip
            build/installer/*.exe
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluxDown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fluxDown/package-lock.json
      - run: npm ci
      - run: npm run zip
      - run: npm run zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: fluxDown/.output/*.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.exe
